<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Directorio de investigadores">
  <title>Directorio de investigadores</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/index.js"></script>
</head>

<body>
  <main class="contenedor directorio">
    <header id="encabezado-directorio" class="cabecera">
      <p class="sobretitulo">Conocimientos 2030</p>
      <p class="sobretitulo">Jornada de Socialización y Difusión de Líneas de Investigación</p>
      <h1>Directorio de investigadores</h1>
      <p id="estado" class="directorio-estado" role="status" aria-live="polite">
      Cargando investigadores…
    </p>
    </header>

    
    <a id="volver-error" class="volver-directorio" href="./" hidden>Volver al directorio</a>

    <section id="seccion-lista" class="lista-investigadores" aria-label="Lista de investigadores" hidden>
      <ul id="investigadores" class="filas-investigadores"></ul>
      <template id="plantilla-investigador">
        <li class="investigador">
          <a class="investigador-enlace">
            <article>
              <h2 class="investigador-nombre"></h2>
              <p class="investigador-institucion"></p>
              <p class="investigador-facultad"></p>
              <p class="investigador-disciplinas"></p>
            </article>
          </a>
        </li>
      </template>
    </section>

    <article id="ficha" class="ficha-investigador" hidden>
      <a class="volver-directorio" href="./">← Volver al directorio</a>
      <header class="cabecera">
        <p class="sobretitulo">Ficha de investigador</p>
        <h1 id="nombre"></h1>
        <a id="correo" class="correo"></a>
      </header>
      <div id="contenido"></div>
    </article>
  </main>

  <footer class="pie">
    <div class="logos">
      <img src="./img/conocimientos.jpeg" alt="Conocimientos 2030">
      <img src="./img/MinCienciaTech.jpeg" alt="Ministerio de Ciencia, Tecnología, Conocimiento e Innovación">
      <img src="./img/UTALCA.jpeg" alt="Universidad de Talca">
      <img src="./img/UOH-square.jpg" alt="Universidad de O'Higgins">
    </div>
  </footer>
</body>

</html>
